name: APK bauen

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Code holen
        uses: actions/checkout@v5

      - name: Node.js einrichten
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Java 21 einrichten (für Capacitor 8 / Gradle 8.14)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK prüfen (ist auf dem Runner vorinstalliert)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Web-App in das Android-Projekt kopieren
        run: npx cap sync android

      - name: gradlew ausführbar machen
        run: chmod +x android/gradlew

      - name: APK bauen (Debug)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: APK zum Herunterladen bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Pflanzen-Wohnung-APK
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
